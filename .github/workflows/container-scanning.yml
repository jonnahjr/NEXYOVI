# ════════════════════════════════════════════════════════════
# Container Scanning - Docker Image Vulnerability Scanning
# ════════════════════════════════════════════════════════════
# Scans Docker images for vulnerabilities using Trivy.
# Runs on pushes to main and on a weekly schedule.
# ════════════════════════════════════════════════════════════

name: "Container Scanning (Trivy)"

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "backend/**"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "backend/**"
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  trivy-scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build -t nexyovi-backend:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nexyovi-backend:${{ github.sha }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          # Ignore unfixed vulns if needed (OS package manager updates)
          # ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Run Trivy on filesystem (non-image)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload filesystem results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-fs-results.sarif"
