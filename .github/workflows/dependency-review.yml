# ════════════════════════════════════════════════════════════
# Dependency Review - PR Dependency Vulnerability Check
# ════════════════════════════════════════════════════════════
# Checks pull requests for new dependencies that contain
# known vulnerabilities. Prevents insecure packages from
# being merged.
# ════════════════════════════════════════════════════════════

name: "Dependency Review"

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "backend/package.json"
      - "backend/package-lock.json"

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: "high"
          # Allow licenses
          allow-licenses: |
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, Unlicense, 0BSD
          # Deny specific licenses
          deny-licenses: |
            GPL-3.0, AGPL-3.0, LGPL-3.0, SSPL-1.0
          # Comment on PR
          comment-summary-in-pr: true
