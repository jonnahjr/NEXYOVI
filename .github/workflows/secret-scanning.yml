# ════════════════════════════════════════════════════════════
# Secret Scanning - Prevent Credential Leakage
# ════════════════════════════════════════════════════════════
# Scans every push and PR for accidentally committed secrets,
# API keys, tokens, and credentials using Gitleaks.
# ════════════════════════════════════════════════════════════

name: "Secret Scanning"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for secrets in environment files
        run: |
          echo "Checking for .env files that might have been committed..."
          if git ls-files | grep -E '\.env$|\.env\.local$|\.env\.production$|\.env\.development$'; then
            echo "❌ ERROR: .env files found in Git index! They should be in .gitignore."
            echo "Files:"
            git ls-files | grep -E '\.env$|\.env\.local$|\.env\.production$'
            exit 1
          else
            echo "✅ No .env files committed."
          fi
