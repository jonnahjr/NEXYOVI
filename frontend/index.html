<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ── Security Meta Tags ────────────────────────────── -->
    <!-- Content Security Policy (meta tag fallback) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; media-src 'self' data: https://*.cloudfront.net https://*.supabase.co; connect-src 'self' https://kgokqftntqszjnwsaegj.supabase.co https://api.nexyovi.com ws://localhost:* http://localhost:*; base-uri 'self'; form-action 'self'; object-src 'none'" />
    <!-- Referrer Policy -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- Prevent automatic detection of phone numbers, emails, addresses -->
    <meta name="format-detection" content="telephone=no, email=no, address=no" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" href="/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Nexyovi Technologies</title>
    <meta name="description" content="Enterprise Software, AI Solutions, Cloud Infrastructure, and Digital Transformation." />
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Nexyovi Technologies" />
    <meta property="og:description" content="Enterprise Software, AI Solutions, Cloud Infrastructure, and Digital Transformation." />
    <meta property="og:image" content="https://www.nexyovi.com/og-image.jpg" />
    <meta property="og:url" content="https://www.nexyovi.com" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexyovi Technologies" />
    <meta name="twitter:description" content="Enterprise Software & AI Solutions" />
    <meta name="twitter:image" content="https://www.nexyovi.com/og-image.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Google Fonts - crossorigin required for SRI-compatible CDN; integrity omitted because Google Fonts CSS is dynamic per UA -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" crossorigin="anonymous" />

    <!-- CSP Nonce: The Vite dev server and production build use nonce-based CSP.
         The backend generates a nonce per request via res.locals.nonce.
         In production, the HTML is served through the backend which injects the nonce.
         For Vite dev mode, 'unsafe-inline' is allowed for HMR. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
